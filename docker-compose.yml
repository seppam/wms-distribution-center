# Full stack: PostgreSQL + API + web (nginx). Copy .env.example to .env and set the three secrets first.
#   docker compose up --build        -> web http://localhost:5174 , API health http://localhost:5301/healthz
# Runs in Production mode: no demo accounts, schema migrated on startup, the first administrator comes from .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms_dc}
      POSTGRES_USER: ${POSTGRES_USER:-wms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5333}:5432"
    volumes:
      - wms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms_admin} -d ${POSTGRES_DB:-wms_dc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${WMS_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-wms_dc};Username=${POSTGRES_USER:-wms_admin};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 random characters)}
      Database__MigrateOnStartup: "true"
      ForwardedHeaders__Enabled: "true"
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 12 characters)}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
    ports:
      - "127.0.0.1:${API_PORT:-5301}:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5174}:8080"

volumes:
  wms_pgdata:
