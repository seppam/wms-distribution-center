# PostgreSQL for local development. The API and frontend run on the host (see README).
# Copy .env.example to .env first (defaults below also work for a quick local start).
services:
  db:
    image: postgres:16-alpine
    container_name: wms-dc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms_dc}
      POSTGRES_USER: ${POSTGRES_USER:-wms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wms_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - wms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms_admin} -d ${POSTGRES_DB:-wms_dc}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wms_pgdata:
